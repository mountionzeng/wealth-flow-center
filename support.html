<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财富流通中心支持</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      color: #2f2717;
      background: #fffaf0;
      line-height: 1.75;
    }
    main {
      width: min(880px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }
    h2 {
      margin-top: 32px;
      font-size: 20px;
    }
    p, li {
      font-size: 16px;
    }
    .muted {
      color: #786a52;
    }
  </style>

<body>
  <main>
    <h1>财富流通中心支持</h1>
    <p class="muted">把时间财富流通成可以复利的知识财富。</p>

    <h2>常见问题</h2>
    <p><strong>学习任务会保存在哪里？</strong></p>
    <p>第一版 App 的学习任务保存在你的设备本地。</p>

    <p><strong>为什么需要日历权限？</strong></p>
    <p>当你开启“写入苹果日历”时，App 会把学习任务创建为日历事件，方便你在系统日历里统一查看安排。</p>

    <p><strong>为什么需要通知权限？</strong></p>
    <p>通知只用于学习任务开始提醒。</p>

    <h2>联系支持</h2>
    <p>如需反馈问题或提出建议，请联系：mountionzeng@users.noreply.github.com</p>
  </main>
</body>
</html>

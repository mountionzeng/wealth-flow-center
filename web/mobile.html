<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>财富流通中心</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --card:rgba(255,251,232,.94);
  --gold:#9a7010; --gold2:#c4960e; --gold3:#e8be40;
  --text:#2a1c06; --t2:#705830; --t3:#a08448; --t4:#c4a868;
  --red:#a03828; --green:#3a6e48; --blue:#2c5878;
  --serif:'Playfair Display',serif;
  --body:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --r:16px; --rs:10px;
  --tabh:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--body);font-size:15px;color:var(--text);background:#fdf6df;overscroll-behavior:none}
#root{min-height:100vh;position:relative}

/* ── silk bg ─────────────────────────────────────────── */
.silk-bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(-45deg,#fff8e8,#fdeeca,#fbe2c0,#f5dce8,#eee0f8,#d8ecf8,#fff8e8);
  background-size:400% 400%;
  animation:silk-flow 22s ease infinite;
}
@keyframes silk-flow{
  0%  {background-position:0% 50%}
  50% {background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ── layout ──────────────────────────────────────────── */
.layout{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding-bottom:var(--tabh)}

/* ── glass card ──────────────────────────────────────── */
.gc{
  background:var(--card);border:none;border-radius:var(--r);
  position:relative;isolation:isolate;
  box-shadow:0 4px 24px rgba(160,120,40,.09),0 1px 4px rgba(160,120,40,.06);
}
.gc::before{
  content:'';position:absolute;inset:-1px;border-radius:calc(var(--r)+1px);
  background:linear-gradient(135deg,rgba(248,218,105,.7) 0%,rgba(208,188,252,.55) 25%,rgba(248,175,155,.6) 50%,rgba(168,215,238,.5) 75%,rgba(248,218,105,.7) 100%);
  background-size:280% 280%;animation:bd-drift 11s ease-in-out infinite alternate;z-index:-1;
}
@keyframes bd-drift{0%{background-position:0% 0%;opacity:.5}50%{background-position:100% 100%;opacity:.85}100%{background-position:20% 80%;opacity:.65}}

/* ── navbar ──────────────────────────────────────────── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;height:var(--tabh);
  background:rgba(253,246,223,.96);backdrop-filter:blur(18px);
  border-top:1px solid rgba(190,148,55,.18);z-index:30;
  display:flex;align-items:stretch;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;font-family:var(--body);color:var(--t3);font-size:10px;padding-bottom:env(safe-area-inset-bottom,0px);transition:color .15s}
.tab.on{color:var(--gold2)}
.tab-ico{font-size:0;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--gold2);margin-top:1px}

/* ── topbar ──────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(253,246,223,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(190,148,55,.12);
  padding:12px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-srv{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:rgba(190,148,55,.1);border:1px solid rgba(190,148,55,.18)}
.topbar-dot{width:5px;height:5px;border-radius:50%;background:var(--gold3);animation:pdot 2.2s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}
.topbar-txt{font-size:10px;color:var(--t3);letter-spacing:.04em}
.topbar-stats{display:flex;gap:8px}
.tstat{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:rgba(190,148,55,.09);border:1px solid rgba(190,148,55,.15)}
.tstat-val{font-family:var(--serif);font-size:15px;color:var(--gold2);line-height:1}
.tstat-lbl{font-size:10px;color:var(--t3)}

/* ── content ─────────────────────────────────────────── */
.content{flex:1;padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── section heading ─────────────────────────────────── */
.sh{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:12px 0 0}
.sh-ico{display:flex;align-items:center;flex-shrink:0}
.sh-text{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:.05em;font-style:italic;white-space:nowrap}
.sh-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(190,148,55,.35),transparent)}

/* ── quest card ──────────────────────────────────────── */
.qc{padding:13px 14px 11px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform .12s}
.qc:active{transform:scale(.985)}
.qc-accent{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.qc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.qc-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid;flex-shrink:0;margin-top:2px}
.qc-titles{flex:1;min-width:0}
.qc-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;word-break:break-all}
.qc-course{font-size:11px;color:var(--t2);margin-top:2px}
.qc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.qc-time{font-size:11px;color:var(--t3)}
.qc-rwds{display:flex;gap:5px;margin-left:auto}
.rwd{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.rwd-xp{background:rgba(44,88,120,.12);color:var(--blue)}
.rwd-w{background:rgba(196,150,14,.14);color:var(--gold2)}
.qc-row2{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.st-chip{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid}
.cal-ok{font-size:10px;color:var(--green);background:rgba(58,110,72,.1);padding:1px 6px;border-radius:4px}
.cal-fail{font-size:10px;color:var(--red);background:rgba(160,56,40,.08);padding:1px 6px;border-radius:4px}
.qc-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid rgba(190,148,55,.12)}
.btn-a{flex:1;padding:7px 4px;border-radius:var(--rs);border:1px solid;font-size:12px;font-family:var(--body);cursor:pointer;background:transparent;transition:background .12s;text-align:center}
.btn-done{border-color:rgba(58,110,72,.4);color:var(--green)}
.btn-done:active{background:rgba(58,110,72,.1)}
.btn-edit{border-color:rgba(196,150,14,.35);color:var(--gold2)}
.btn-edit:active{background:rgba(196,150,14,.1)}
.btn-del{border-color:rgba(160,56,40,.35);color:var(--red)}
.btn-del:active{background:rgba(160,56,40,.08)}
.qc-done{opacity:.5}
@keyframes cfl{0%{box-shadow:0 0 0 0 rgba(58,110,72,.5)}70%{box-shadow:0 0 0 14px rgba(58,110,72,0)}100%{box-shadow:0 0 0 0 rgba(58,110,72,0)}}
.flash-card{animation:cfl .5s ease-out}

/* countdown */
.cd-live{font-size:11px;font-weight:600;color:var(--green)}
.cd-soon{font-size:11px;color:var(--gold2)}
.cd-over{font-size:11px;color:var(--red)}
.cd-done{font-size:11px;color:var(--t4)}

/* ── tag chips ───────────────────────────────────────── */
.tag-list{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:20px}
.tag-chip{padding:7px 13px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid;transition:opacity .12s,transform .1s;font-weight:500;line-height:1.3;text-align:center}
.tag-chip:active{transform:scale(.95);opacity:.8}

/* ── bar chart ───────────────────────────────────────── */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:11px;color:var(--t2);min-width:40px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:rgba(160,120,40,.1);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .9s cubic-bezier(.4,0,.2,1);position:relative}
.bar-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5));animation:shimmer 2.5s infinite}
@keyframes shimmer{0%{opacity:0;transform:translateX(-10px)}50%{opacity:1}100%{opacity:0;transform:translateX(5px)}}
.bar-val{font-size:11px;color:var(--t3);min-width:30px}

/* ── weekly ──────────────────────────────────────────── */
.day-block{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(190,148,55,.1)}
.day-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.day-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day-name{font-family:var(--serif);font-size:13px;color:var(--gold);font-style:italic}
.day-date{font-size:11px;color:var(--t4)}
.day-task{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:rgba(240,220,160,.15);border:1px solid rgba(190,148,55,.1);margin-bottom:4px;flex-wrap:wrap}
.day-time{font-size:11px;color:var(--t2);white-space:nowrap;min-width:84px}
.day-st{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid}
.day-st.done{color:var(--green);border-color:rgba(58,110,72,.35);background:rgba(58,110,72,.07)}
.day-st.active{color:var(--gold2);border-color:rgba(196,150,14,.4);background:rgba(196,150,14,.08)}
.day-st.upcoming{color:var(--t2);border-color:rgba(160,120,40,.22)}
.day-course{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(190,148,55,.12);color:var(--gold2);border:1px solid rgba(190,148,55,.22)}
.day-ttl{font-size:12px;color:var(--text);flex:1;line-height:1.3}

/* ── form sheet ──────────────────────────────────────── */
.ovl{position:fixed;inset:0;background:rgba(30,18,5,.3);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:flex-end;animation:fin .2s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;background:rgba(255,251,232,.98);
  border-radius:22px 22px 0 0;border-top:1px solid rgba(190,148,55,.22);
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  max-height:90vh;overflow-y:auto;animation:sup .25s cubic-bezier(.4,0,.2,1);
}
@keyframes sup{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.sh-handle{width:36px;height:4px;background:rgba(190,148,55,.3);border-radius:2px;margin:0 auto 16px}
.sh-title{font-family:var(--serif);font-size:17px;color:var(--gold);text-align:center;margin-bottom:16px;font-style:italic}
.fg{margin-bottom:12px}
.fl{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
.fi,.fsel{width:100%;padding:10px 12px;background:rgba(255,248,220,.6);border:1px solid rgba(190,148,55,.22);border-radius:var(--rs);color:var(--text);font-family:var(--body);font-size:14px;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.fi:focus,.fsel:focus{outline:none;border-color:var(--gold3);background:rgba(255,248,220,.9)}
.fsel option{background:#fffae8}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer}
.fchk input{accent-color:var(--gold2);width:16px;height:16px}
.btn-sub{width:100%;padding:13px;background:linear-gradient(100deg,var(--gold),var(--gold2),var(--gold3));border:none;border-radius:var(--r);color:#fff8e8;font-family:var(--body);font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;text-shadow:0 1px 2px rgba(80,40,0,.25);letter-spacing:.04em}
.btn-can{width:100%;padding:11px;background:transparent;border:1px solid rgba(190,148,55,.25);border-radius:var(--r);color:var(--t2);font-family:var(--body);font-size:13px;cursor:pointer;margin-top:8px}

/* ── confirm ─────────────────────────────────────────── */
.covl{position:fixed;inset:0;background:rgba(30,18,5,.35);backdrop-filter:blur(7px);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.cbox{background:rgba(255,251,232,.98);border:1px solid rgba(190,148,55,.25);border-radius:var(--r);padding:24px 20px;width:100%;max-width:280px;text-align:center;box-shadow:0 8px 40px rgba(120,80,20,.15)}
.c-ttl{font-family:var(--serif);font-size:16px;color:var(--gold);margin-bottom:8px;font-style:italic}
.c-body{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.c-btns{display:flex;gap:10px}
.c-yes{flex:1;padding:10px;border-radius:var(--rs);background:rgba(160,56,40,.1);border:1px solid rgba(160,56,40,.35);color:var(--red);font-family:var(--body);font-size:13px;cursor:pointer}
.c-no{flex:1;padding:10px;border-radius:var(--rs);background:rgba(190,148,55,.08);border:1px solid rgba(190,148,55,.25);color:var(--t2);font-family:var(--body);font-size:13px;cursor:pointer}

/* ── toast ───────────────────────────────────────────── */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,251,232,.97);border:1px solid rgba(190,148,55,.3);border-radius:22px;padding:9px 22px;font-size:13px;color:var(--text);z-index:100;box-shadow:0 4px 20px rgba(120,80,20,.15);white-space:nowrap;animation:tin .25s cubic-bezier(.4,0,.2,1)}
.toast.s{border-color:rgba(58,110,72,.45);color:var(--green)}
.toast.e{border-color:rgba(160,56,40,.45);color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── FAB ─────────────────────────────────────────────── */
.fab{
  position:fixed;bottom:calc(var(--tabh) + 14px);right:18px;z-index:25;
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3));
  box-shadow:0 4px 18px rgba(160,120,20,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s;
}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(160,120,20,.25)}
.fab svg{filter:drop-shadow(0 1px 1px rgba(80,40,0,.2))}

/* ── empty / loading ─────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:13px;line-height:2.2}
.empty-ico{display:flex;justify-content:center;margin-bottom:12px;opacity:.5}
.spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px;position:relative;z-index:1}
.ring{width:42px;height:42px;border:3px solid rgba(190,148,55,.2);border-top-color:var(--gold2);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-lbl{font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:.06em;font-style:italic}

/* tag use modal */
.tag-preview{text-align:center;padding:14px;border-radius:var(--r);background:rgba(190,148,55,.07);border:1px solid rgba(190,148,55,.15);margin-bottom:16px}
.tag-preview-ttl{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.tag-preview-sub{font-size:12px;color:var(--t2)}
.tag-preview-dur{font-size:14px;color:var(--gold2);font-weight:600;margin-top:6px;font-family:var(--serif)}

@keyframes flame{0%,100%{transform:scaleX(1) scaleY(1)}25%{transform:scaleX(.92) scaleY(1.06)}75%{transform:scaleX(1.07) scaleY(.94)}}
.flame-anim{transform-origin:50% 100%;animation:flame 1.8s ease-in-out infinite}

/* ── share overlay ───────────────────────────────────── */
.share-ovl{position:fixed;inset:0;background:rgba(20,12,4,.55);backdrop-filter:blur(10px);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:0;animation:fin .2s}
.share-sheet{width:100%;background:rgba(255,251,232,.99);border-radius:22px 22px 0 0;border-top:1px solid rgba(190,148,55,.25);padding:18px 0 calc(env(safe-area-inset-bottom,0px)+20px);animation:sup .28s cubic-bezier(.4,0,.2,1)}
.share-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 18px 14px;border-bottom:1px solid rgba(190,148,55,.12)}
.share-hdr-title{font-family:var(--serif);font-size:16px;color:var(--gold);font-style:italic}
.share-close{background:none;border:none;font-size:22px;color:var(--t3);cursor:pointer;padding:0;line-height:1}
.share-tabs{display:flex;gap:0;padding:12px 16px 0}
.share-tab{flex:1;padding:8px 4px;background:none;border:none;font-family:var(--body);font-size:12px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.share-tab.on{color:var(--gold2);border-bottom-color:var(--gold2)}
.share-preview{padding:16px 16px 0;display:flex;justify-content:center}

/* ── the actual share cards (fixed 375×375 for 1:1) ── */
.sc{
  width:375px;height:375px;border-radius:20px;
  position:relative;overflow:hidden;flex-shrink:0;
  background:#fdf6df;
  font-family:var(--body);
}
/* silk bg layers inside card — static (no animation) for screenshot */
.sc-silk{position:absolute;inset:0;z-index:0}
.sc-blob{position:absolute;border-radius:50%;filter:blur(40px)}
.sc-b1{width:280px;height:280px;top:-80px;left:-60px;background:radial-gradient(circle,rgba(238,205,110,.75),rgba(245,220,155,.4) 50%,transparent 70%)}
.sc-b2{width:220px;height:220px;bottom:-60px;right:-40px;background:radial-gradient(circle,rgba(238,172,145,.65),rgba(248,195,175,.35) 50%,transparent 70%)}
.sc-b3{width:180px;height:180px;top:30%;right:-20px;background:radial-gradient(circle,rgba(205,188,245,.55),transparent 65%)}
.sc-b4{width:160px;height:160px;bottom:10%;left:-20px;background:radial-gradient(circle,rgba(242,185,210,.45),transparent 65%)}
.sc-body{position:relative;z-index:1;width:100%;height:100%;padding:24px;display:flex;flex-direction:column}

/* branding row */
.sc-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sc-brand-left{display:flex;align-items:center;gap:8px}
.sc-brand-name{font-family:var(--serif);font-size:12px;color:var(--gold);font-style:italic;letter-spacing:.04em}
.sc-brand-date{font-size:10px;color:var(--t3);text-align:right;line-height:1.5}

/* divider */
.sc-divider{height:1px;background:linear-gradient(90deg,rgba(190,148,55,.5),rgba(190,148,55,.15),transparent);margin-bottom:14px}

/* big number */
.sc-hero{display:flex;align-items:baseline;gap:5px;margin-bottom:4px}
.sc-hero-num{font-family:var(--serif);font-size:64px;line-height:1;color:var(--gold);font-weight:600}
.sc-hero-unit{font-size:18px;color:var(--t2);font-weight:500}
.sc-hero-label{font-size:11px;color:var(--t3);margin-bottom:12px}

/* streak pill */
.sc-streak{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;background:rgba(190,148,55,.12);border:1px solid rgba(190,148,55,.2);margin-bottom:14px}
.sc-streak-val{font-family:var(--serif);font-size:16px;color:var(--gold2)}
.sc-streak-lbl{font-size:11px;color:var(--t3)}

/* task list */
.sc-tasks{flex:1;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.sc-task{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;background:rgba(255,248,220,.6);border:1px solid rgba(190,148,55,.12)}
.sc-task-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sc-task-txt{font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.sc-task-dur{font-size:10px;color:var(--t3);white-space:nowrap}
.sc-more{font-size:10px;color:var(--t3);text-align:center;padding-top:4px;font-style:italic}

/* mini bars */
.sc-bars{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.sc-bar-row{display:flex;align-items:center;gap:6px}
.sc-bar-lbl{font-size:10px;color:var(--t2);min-width:32px;text-align:right}
.sc-bar-track{flex:1;height:7px;background:rgba(160,120,40,.1);border-radius:4px;overflow:hidden}
.sc-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#c8980c,#e8c040)}
.sc-bar-val{font-size:10px;color:var(--t3);min-width:26px}

/* weekly outline text */
.sc-outline{font-size:11px;color:var(--t2);line-height:1.65;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}

/* month mini stats */
.sc-mstats{display:flex;gap:8px;flex:1;align-items:flex-end}
.sc-mstat{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:rgba(255,248,220,.7);border:1px solid rgba(190,148,55,.15)}
.sc-mstat-val{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1;margin-bottom:3px}
.sc-mstat-lbl{font-size:10px;color:var(--t3)}

/* wave decor */
.sc-wave{position:absolute;bottom:14px;right:16px;opacity:.2}

/* download btn */
.share-dl-btn{margin:14px 16px 0;width:calc(100% - 32px);padding:13px;background:linear-gradient(100deg,var(--gold),var(--gold2),var(--gold3));border:none;border-radius:14px;color:#fff8e8;font-family:var(--body);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;text-shadow:0 1px 2px rgba(80,40,0,.25)}
.share-dl-btn:active{opacity:.88}
.share-generating{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ── constants ───────────────────────────────────────── */
const VTYPES = ['course','review','exercise','reading','practice','writing','other'];
const safeType = t => VTYPES.includes(t) ? t : 'course';
const SYNC_WL  = ['synced','failed','pending','none'];
const safeSync = s => SYNC_WL.includes(s) ? s : (s ? 'unknown' : 'none');
const TC = {
  course:   {c:'#7a5c10',bg:'rgba(200,170,80,.15)',lbl:'课程'},
  review:   {c:'#2c5878',bg:'rgba(80,140,190,.14)',lbl:'复习'},
  exercise: {c:'#3a6e48',bg:'rgba(80,160,100,.13)',lbl:'练习'},
  reading:  {c:'#6a4c30',bg:'rgba(160,120,60,.14)',lbl:'阅读'},
  practice: {c:'#804020',bg:'rgba(180,100,50,.13)',lbl:'实践'},
  writing:  {c:'#5a3a70',bg:'rgba(140,80,180,.13)',lbl:'写作'},
  other:    {c:'#4a4a50',bg:'rgba(120,120,130,.12)',lbl:'其他'},
};
const gt = t => TC[safeType(t)] ?? TC.course;
const BARCOLS = ['#c4960e','#5a8c6a','#5888a8','#a07848','#c07840','#8060a0','#707080'];
const TABS = [
  {id:'quests', lbl:'任务'},
  {id:'tags',   lbl:'速记'},
  {id:'charts', lbl:'图表'},
  {id:'weekly', lbl:'周览'},
];

/* ── normalize ───────────────────────────────────────── */
const normPlayer = p => { if(!p||typeof p!=='object') p={}; return {level:Number(p.level)||1,xp:Number(p.xp)||0,xp_target:p.xp_target!=null?Number(p.xp_target):null,wealth:Number(p.wealth)||0,streak:Number(p.streak)||0,total_done:Number(p.total_done)||0,total_minutes:Number(p.total_minutes)||0}; };
const normQuest = q => { if(!q||typeof q!=='object'||q.id==null) return null; return {id:q.id,title:typeof q.title==='string'&&q.title?q.title:'(无标题)',task_type:safeType(q.task_type),course_name:typeof q.course_name==='string'?q.course_name:'',start:typeof q.start==='string'?q.start:'',end:typeof q.end==='string'?q.end:'',completed_at:q.completed_at??null,status:typeof q.status==='string'?q.status:'',reward_xp:q.reward_xp!=null?Number(q.reward_xp):null,reward_wealth:q.reward_wealth!=null?Number(q.reward_wealth):null,duration_minutes:q.duration_minutes!=null?Number(q.duration_minutes):null,label:q.label??'',calendar_sync_status:safeSync(q.calendar_sync_status),calendar_sync_message:typeof q.calendar_sync_message==='string'?q.calendar_sync_message:''}; };
const normTag = t => { if(!t||typeof t!=='object'||t.id==null) return null; return {id:t.id,title:typeof t.title==='string'&&t.title?t.title:'(无标题)',task_type:safeType(t.task_type),course_name:typeof t.course_name==='string'?t.course_name:'',duration_minutes:t.duration_minutes!=null?Number(t.duration_minutes):0,uses:Number(t.uses)||0,label:t.label??''}; };
const normCharts = c => { if(!c||typeof c!=='object') return {days:[],day_minutes:[],type_minutes:{},course_minutes:{}}; return {days:Array.isArray(c.days)?c.days.filter(Boolean):[],day_minutes:Array.isArray(c.day_minutes)?c.day_minutes.map(Number):[],type_minutes:(c.type_minutes&&typeof c.type_minutes==='object')?c.type_minutes:{},course_minutes:(c.course_minutes&&typeof c.course_minutes==='object')?c.course_minutes:{}}; };
const normalize = raw => { const s=(raw&&typeof raw==='object')?(raw.data??raw):{}; return {server_time:typeof s.server_time==='string'?s.server_time:'',player:normPlayer(s.player),quests:Array.isArray(s.quests)?s.quests.map(normQuest).filter(Boolean):[],quick_tags:Array.isArray(s.quick_tags)?s.quick_tags.map(normTag).filter(Boolean):[],charts:normCharts(s.charts),weekly_outline:typeof s.weekly_outline==='string'?s.weekly_outline:'',weekly:s.weekly??null,reminders:Array.isArray(s.reminders)?s.reminders:[]}; };

/* ── time helpers ────────────────────────────────────── */
const toInput = s => (s??'').replace(' ','T').slice(0,16);
const toAPI   = s => s.replace('T',' ');
const nowPlus = m => { const d=new Date(Date.now()+m*60000); d.setSeconds(0,0); return d.toISOString().slice(0,16); };
const parseT  = s => { if(!s) return null; const[dt,tm]=s.split(' '); if(!dt||!tm) return null; return new Date(`${dt}T${tm}:00`); };
const fmtMs   = ms => { if(ms<=0) return '已结束'; const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60; return h>0?`${h}h${m}m`:`${m}m${s<10?'0'+s:s}s`; };
const fmtTime = s => { if(!s) return ''; const[,tm]=s.split(' '); return tm??''; };

/* ── API ─────────────────────────────────────────────── */
const H = {'Content-Type':'application/json'};
const API = {
  state:  ()     => fetch('/api/state').then(r=>r.json()),
  addQ:   b      => fetch('/api/quests',{method:'POST',headers:H,body:JSON.stringify(b)}).then(r=>r.json()),
  editQ:  (id,b) => fetch(`/api/quests/${id}`,{method:'PATCH',headers:H,body:JSON.stringify(b)}).then(r=>r.json()),
  delQ:   id     => fetch(`/api/quests/${id}`,{method:'DELETE'}).then(r=>r.json()),
  complQ: id     => fetch(`/api/quests/${id}/complete`,{method:'POST'}).then(r=>r.json()),
  useTag: (id,b) => fetch(`/api/tags/${id}/create`,{method:'POST',headers:H,body:JSON.stringify(b)}).then(r=>r.json()),
};

/* ── SilkBg ──────────────────────────────────────────── */
const SilkBg = () => {
  return (
    <div className="silk-bg"/>
  );
};

/* ── icons ───────────────────────────────────────────── */
const IconFlame = ({size=22,anim=false}) => (
  <svg width={size} height={size*1.1} viewBox="0 0 22 24" fill="none">
    <path className={anim?'flame-anim':''} d="M11 2 C9 6 8 9.5 10 12 C10.6 13 11.4 13 12 12 C14 9.5 13 6 11 2Z" fill="#f0b010" opacity=".9"/>
    <path className={anim?'flame-anim':''} d="M11 5 C10 7.5 9.5 10 10.5 11.5 C10.8 12 11.2 12 11.5 11.5 C12.5 10 12 7.5 11 5Z" fill="#fad040" opacity=".85"/>
    <path d="M11 12 L11 14" stroke="#3a2008" strokeWidth="1"/>
    <rect x="8.5" y="14" width="5" height="8" rx="1.2" fill="rgba(255,251,232,.97)" stroke="#c89018" strokeWidth="1"/>
    <path d="M8.5 16.5 Q7 18 7.5 19.5" stroke="rgba(220,160,180,.6)" strokeWidth=".8" fill="none"/>
  </svg>
);

const IconBook = ({size=20}) => (
  <svg width={size*1.2} height={size} viewBox="0 0 24 18" fill="none" strokeLinecap="round">
    <path d="M12 3 C10 2.5 6 3.5 4 5 L4 16 C6 15 10 14.5 12 15Z" fill="rgba(200,160,60,.18)" stroke="#b88010" strokeWidth="1"/>
    <path d="M12 3 C14 2.5 18 3.5 20 5 L20 16 C18 15 14 14.5 12 15Z" fill="rgba(160,130,200,.18)" stroke="#9870b8" strokeWidth="1"/>
    <line x1="12" y1="3" x2="12" y2="15" stroke="#a07010" strokeWidth="1.4"/>
  </svg>
);

const IconStar = ({size=14}) => (
  <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
    <path d="M7 1 L7.7 5 L12 5.5 L9 8 L10 12.5 L7 10.5 L4 12.5 L5 8 L2 5.5 L6.3 5 Z" fill="rgba(196,150,14,.5)" stroke="#c8980c" strokeWidth=".7"/>
  </svg>
);

const IconClock = ({size=14}) => (
  <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
    <circle cx="7" cy="7" r="6" stroke="#c8980c" strokeWidth=".9" fill="rgba(196,150,14,.08)"/>
    <line x1="7" y1="3.5" x2="7" y2="7.5" stroke="#c8980c" strokeWidth="1.1" strokeLinecap="round"/>
    <line x1="7" y1="7.5" x2="9.5" y2="9" stroke="#a07010" strokeWidth=".9" strokeLinecap="round"/>
  </svg>
);

const SH = ({icon, children}) => (
  <div className="sh">
    <div className="sh-ico">{icon}</div>
    <span className="sh-text">{children}</span>
    <div className="sh-line"/>
  </div>
);

/* ── Toast / Confirm ─────────────────────────────────── */
const Toast = ({msg,type,onDone}) => {
  useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t);},[onDone]);
  return <div className={`toast ${type==='success'?'s':'e'}`}>{msg}</div>;
};
const Confirm = ({msg,onYes,onNo}) => (
  <div className="covl" onClick={onNo}>
    <div className="cbox" onClick={e=>e.stopPropagation()}>
      <div className="c-ttl">确认操作</div>
      <div className="c-body">{msg}</div>
      <div className="c-btns"><button className="c-yes" onClick={onYes}>确认删除</button><button className="c-no" onClick={onNo}>取消</button></div>
    </div>
  </div>
);

/* ── Countdown ───────────────────────────────────────── */
const useNow = () => { const[now,setNow]=useState(Date.now); useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t);},[]);return now; };
const Countdown = ({quest:q}) => {
  const now = useNow();
  if(q.completed_at) return <span className="cd-done">已完成</span>;
  const st=parseT(q.start),en=parseT(q.end);
  if(!st||!en) return null;
  if(now<st.getTime()) return <span className="cd-soon">还有 {fmtMs(st.getTime()-now)}</span>;
  if(now<=en.getTime()) return <span className="cd-live">剩余 {fmtMs(en.getTime()-now)}</span>;
  return <span className="cd-over">已结束</span>;
};

/* ── QuestCard ───────────────────────────────────────── */
const QuestCard = ({quest:q,onComplete,onEdit,onDelete}) => {
  const [flash,setFlash] = useState(false);
  const tc = gt(q.task_type), done = !!q.completed_at;
  const scol = done?'var(--green)':q.status==='overdue'?'var(--red)':'var(--t4)';
  const handleDone = () => { setFlash(true); setTimeout(()=>setFlash(false),550); onComplete(q.id); };
  return (
    <div className={`gc qc ${done?'qc-done':''} ${flash?'flash-card':''}`}>
      <div className="qc-accent" style={{background:tc.c}}/>
      <div className="qc-top">
        <span className="qc-badge" style={{color:tc.c,background:tc.bg,borderColor:`${tc.c}44`}}>{tc.lbl}</span>
        <div className="qc-titles">
          <div className="qc-title">{q.title}</div>
          {q.course_name&&<div className="qc-course">{q.course_name}</div>}
        </div>
      </div>
      <div className="qc-meta">
        <span className="qc-time">{fmtTime(q.start)} – {fmtTime(q.end)}{q.duration_minutes?` · ${q.duration_minutes}m`:''}</span>
        <div className="qc-rwds">
          {q.reward_xp!=null&&<span className="rwd rwd-xp">+{q.reward_xp} XP</span>}
          {q.reward_wealth!=null&&<span className="rwd rwd-w">+{q.reward_wealth} ◈</span>}
        </div>
      </div>
      <div className="qc-row2">
        <span className="st-chip" style={{color:scol,background:`${scol}18`,borderColor:`${scol}44`}}>{done?'已完成':q.status==='overdue'?'已逾期':(q.status||'')}</span>
        <Countdown quest={q}/>
        {q.calendar_sync_status==='synced'&&<span className="cal-ok">📅已同步</span>}
        {q.calendar_sync_status==='failed'&&<span className="cal-fail">📅失败</span>}
      </div>
      {!done&&(
        <div className="qc-actions">
          <button className="btn-a btn-done" onClick={handleDone}>✓ 完成</button>
          <button className="btn-a btn-edit" onClick={()=>onEdit(q)}>✎ 编辑</button>
          <button className="btn-a btn-del"  onClick={()=>onDelete(q.id)}>✕ 删除</button>
        </div>
      )}
    </div>
  );
};

/* ── QuestsTab ───────────────────────────────────────── */
const QuestsTab = ({quests=[],onComplete,onEdit,onDelete}) => {
  const pend=quests.filter(q=>!q.completed_at), done=quests.filter(q=>!!q.completed_at);
  if(!quests.length) return (
    <div className="empty"><div className="empty-ico"><IconFlame size={36} anim/></div>暂无任务<br/>点击右下角 ＋ 创建</div>
  );
  return (
    <div>
      {pend.length>0&&<><SH icon={<IconFlame size={16} anim/>}>进行中 · {pend.length}</SH>{pend.map(q=><QuestCard key={q.id} quest={q} onComplete={onComplete} onEdit={onEdit} onDelete={onDelete}/>)}</>}
      {done.length>0&&<><SH icon={<IconBook size={16}/>}>已完成 · {done.length}</SH>{done.map(q=><QuestCard key={q.id} quest={q} onComplete={onComplete} onEdit={onEdit} onDelete={onDelete}/>)}</>}
    </div>
  );
};

/* ── TagsTab ─────────────────────────────────────────── */
const TagsTab = ({tags=[],onUse}) => {
  if(!tags.length) return <div className="empty"><div className="empty-ico"><IconBook size={32}/></div>暂无快捷标签</div>;
  return (
    <div>
      <SH icon={<IconBook size={16}/>}>复习快捷标签</SH>
      <div style={{fontSize:11,color:'var(--t3)',marginBottom:10,fontStyle:'italic'}}>点击即可按历史时长自动创建复习</div>
      <div className="tag-list">
        {tags.map(tag=>{const tc=gt(tag.task_type);return(
          <div key={tag.id} className="tag-chip" style={{color:tc.c,background:tc.bg,borderColor:`${tc.c}40`}} onClick={()=>onUse(tag)}>
            <div style={{fontWeight:600}}>{tag.title}</div>
            {tag.course_name&&<div style={{fontSize:10,opacity:.75}}>{tag.course_name}</div>}
            <div style={{fontSize:10,marginTop:2}}>{tc.lbl} · {tag.duration_minutes}m · ×{tag.uses}</div>
          </div>
        );})}
      </div>
    </div>
  );
};

/* ── ChartsTab ───────────────────────────────────────── */
const ChartsTab = ({charts}) => {
  const {days=[],day_minutes=[],type_minutes={},course_minutes={}} = charts??{};
  const maxD=Math.max(...day_minutes,1), maxT=Math.max(...Object.values(type_minutes),1), maxC=Math.max(...Object.values(course_minutes),1);
  return (
    <div style={{paddingBottom:20}}>
      <SH icon={<IconStar size={14}/>}>每日时长</SH>
      <div className="gc" style={{padding:'12px 14px',marginBottom:12}}>
        {days.length===0?<div style={{fontSize:12,color:'var(--t3)',textAlign:'center',padding:'16px 0'}}>暂无数据</div>
          :days.map((d,i)=><div key={d} className="bar-row">
            <div className="bar-lbl">{(d??'').slice(5)}</div>
            <div className="bar-track"><div className="bar-fill" style={{width:`${((day_minutes[i]??0)/maxD)*100}%`,background:'linear-gradient(90deg,#c8980c,#e8c040)'}}/></div>
            <div className="bar-val">{day_minutes[i]??0}m</div>
          </div>)}
      </div>
      {Object.keys(type_minutes).length>0&&<>
        <SH icon={<IconBook size={14}/>}>按类型</SH>
        <div className="gc" style={{padding:'12px 14px',marginBottom:12}}>
          {Object.entries(type_minutes).map(([t,m],i)=><div key={t} className="bar-row">
            <div className="bar-lbl">{gt(t).lbl}</div>
            <div className="bar-track"><div className="bar-fill" style={{width:`${(m/maxT)*100}%`,background:BARCOLS[i%BARCOLS.length]}}/></div>
            <div className="bar-val">{m}m</div>
          </div>)}
        </div>
      </>}
      {Object.keys(course_minutes).length>0&&<>
        <SH icon={<IconStar size={14}/>}>按课程</SH>
        <div className="gc" style={{padding:'12px 14px'}}>
          {Object.entries(course_minutes).map(([c,m],i)=><div key={c} className="bar-row">
            <div className="bar-lbl" title={c}>{c.length>8?c.slice(0,8)+'…':c}</div>
            <div className="bar-track"><div className="bar-fill" style={{width:`${(m/maxC)*100}%`,background:BARCOLS[(i+2)%BARCOLS.length]}}/></div>
            <div className="bar-val">{m}m</div>
          </div>)}
        </div>
      </>}
    </div>
  );
};

/* ── WeeklyTab ───────────────────────────────────────── */
const WeeklyTab = ({weekly,weekly_outline,reminders=[]}) => {
  const renderWeekly = () => {
    if(!weekly) return <div style={{fontSize:12,color:'var(--t3)',textAlign:'center',padding:'16px 0'}}>暂无本周数据</div>;
    if(typeof weekly==='string') return <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{weekly}</div>;
    if(typeof weekly==='object'&&!Array.isArray(weekly)){
      return Object.entries(weekly).map(([day,info])=>{
        const tasks=Array.isArray(info?.tasks)?info.tasks:(Array.isArray(info)?info:[]), date=info?.date??'';
        return(
          <div key={day} className="day-block">
            <div className="day-hdr"><span className="day-name">{day}</span><span className="day-date">{date}</span></div>
            {tasks.length===0?<div style={{fontSize:12,color:'var(--t4)',fontStyle:'italic'}}>暂无任务</div>
              :tasks.map((t,i)=>{
                const sl=t?.completed_at?'done':t?.status==='active'?'active':'upcoming';
                const st=t?.completed_at?'已完成':t?.status==='active'?'进行中':'待开始';
                return(
                  <div key={i} className="day-task">
                    {(t?.start||t?.end)&&<span className="day-time">{(t.start??'').slice(11,16)} – {(t.end??'').slice(11,16)}</span>}
                    <span className={`day-st ${sl}`}>{st}</span>
                    {t?.course_name&&<span className="day-course">{t.course_name}</span>}
                    <span className="day-ttl">{t?.title??''}</span>
                  </div>
                );
              })
            }
          </div>
        );
      });
    }
    return <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{JSON.stringify(weekly,null,2)}</div>;
  };
  return (
    <div style={{paddingBottom:20}}>
      {reminders.length>0&&<>
        <SH icon={<IconFlame size={14}/>}>提醒</SH>
        {reminders.map((r,i)=><div key={i} className="gc" style={{padding:'10px 12px',marginBottom:8,fontSize:12,color:'var(--t2)',borderLeft:'3px solid rgba(190,148,55,.5)'}}>{typeof r==='string'?r:JSON.stringify(r)}</div>)}
      </>}
      <SH icon={<IconBook size={14}/>}>每周大纲</SH>
      {weekly_outline&&<div style={{fontSize:11,color:'var(--t3)',marginBottom:12,fontStyle:'italic'}}>{weekly_outline}</div>}
      <div className="gc" style={{padding:'12px 14px'}}>{renderWeekly()}</div>
    </div>
  );
};

/* ── Modals ──────────────────────────────────────────── */
const mkForm = q => q?.id
  ? {task_type:safeType(q.task_type),course_name:q.course_name??'',title:q.title??'',start:toInput(q.start),end:toInput(q.end),write_calendar:false}
  : {task_type:'course',course_name:'',title:'',start:nowPlus(0),end:nowPlus(60),write_calendar:false};

const QuestModal = ({quest,onClose,onSave}) => {
  const isEdit=!!quest?.id, [f,setF]=useState(()=>mkForm(quest)), [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=async e=>{e.preventDefault();if(!f.title.trim())return;setBusy(true);const body={task_type:f.task_type,course_name:f.course_name||undefined,title:f.title.trim(),start:toAPI(f.start),end:toAPI(f.end),write_calendar:f.write_calendar};await onSave(body);setBusy(false);};
  return(
    <div className="ovl" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/>
        <div className="sh-title">{isEdit?'编辑任务':'✦ 新建任务'}</div>
        <form onSubmit={submit}>
          <div className="fg"><label className="fl">学习类型</label>
            <select className="fsel" value={f.task_type} onChange={e=>set('task_type',e.target.value)}>

/* Share overlay */
const ShareOverlay = ({data,onClose}) => {
  const [activeTab, setActiveTab] = useState('today');
  const [busy, setBusy] = useState(false);
  const cardId = {today:'share-card-today',week:'share-card-week',month:'share-card-month'}[activeTab];
  const cardLabel = {today:'今日学习','week':'本周进度',month:'本月总结'}[activeTab];

  const download = async () => {
    const el = document.getElementById(cardId);
    if (!el || !window.html2canvas) return;
    setBusy(true);
    try {
      const canvas = await window.html2canvas(el, {
        scale: 3, useCORS: true, allowTaint: true,
        backgroundColor: null, logging: false,
      });
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `财富流通中心_${cardLabel}_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.png`;
      a.click();
    } catch(e) { alert('生成图片失败，请重试'); }
    finally { setBusy(false); }
  };

  return (
    <div className="share-ovl" onClick={onClose}>
      <div className="share-sheet" onClick={e=>e.stopPropagation()}>
        <div className="share-hdr">
          <span className="share-hdr-title">✦ 分享学习卡片</span>
          <button className="share-close" onClick={onClose}>×</button>
        </div>

          {[['today','今日'],['week','本周'],['month','本月']].map(([id,lbl])=>(
            <button key={id} className={`share-tab ${activeTab===id?'on':''}`} onClick={()=>setActiveTab(id)}>{lbl}</button>
          ))}
        </div>
        <div className="share-preview">
          <div style={{transform:'scale(0.88)',transformOrigin:'top center',marginBottom:-375*0.12}}>
            {activeTab==='today' && <TodayCard data={data}/>}
            {activeTab==='week'  && <WeekCard  data={data}/>}
            {activeTab==='month' && <MonthCard data={data}/>}
          </div>
        </div>
        <button className={`share-dl-btn ${busy?'share-generating':''}`} onClick={download}>
          {busy ? '生成中…' : '⬇ 保存图片到相册'}
        </button>
      </div>
    </div>
  );
};
  const [data,setData]   = useState(null);
  const [loading,setLoad]= useState(true);
  const [tab,setTab]     = useState(()=>localStorage.getItem('wc_tab_m')||'quests');
  const [toast,setToast] = useState(null);
  const [confirm,setConf]= useState(null);
  const [modal,setModal] = useState(null);
  const [sharing,setSharing] = useState(false);
  const loadSeqRef = useRef(0), mutRef = useRef(false);
  const toast$ = useCallback((msg,type='success')=>setToast({msg,type,k:Date.now()}),[]);

  const load = useCallback(async(fromMut=false)=>{
    if(!fromMut&&mutRef.current) return;
    const seq=++loadSeqRef.current;
    try{const r=await API.state();if(seq!==loadSeqRef.current)return;setData(normalize(r));}
    catch{if(seq===loadSeqRef.current)toast$('加载失败','error');}
    finally{if(seq===loadSeqRef.current)setLoad(false);}
  },[toast$]);

  useEffect(()=>{load();},[load]);
  useEffect(()=>{const t=setInterval(load,30000);return()=>clearInterval(t);},[load]);
  useEffect(()=>{localStorage.setItem('wc_tab_m',tab);},[tab]);

  const withMut = async fn=>{mutRef.current=true;try{await fn();await load(true);}finally{mutRef.current=false;}};
  const completeQ = async id=>{await withMut(async()=>{await API.complQ(id);toast$('任务完成！✦');});};
  const deleteQ   = id=>setConf({id,msg:'确定要删除这个任务吗？'});
  const doDelete  = async()=>{ if(!confirm)return; await withMut(async()=>{await API.delQ(confirm.id);toast$('已删除');}); setConf(null); };
  const saveQuest = async body=>{ await withMut(async()=>{ if(modal?.quest?.id){await API.editQ(modal.quest.id,body);toast$('已更新');}else{await API.addQ(body);toast$('任务已创建 ✦');} setModal(null); }); };
  const saveTag   = async body=>{ await withMut(async()=>{await API.useTag(modal.tag.id,body);toast$('已创建 ✦');setModal(null);}); };

  const d=data??{};

  if(loading) return(
    <><SilkBg/>
      <div className="spin-wrap">
        <IconFlame size={40} anim/>
        <div className="ring" style={{marginTop:8}}/>
        <div className="spin-lbl">财富流通中心</div>
      </div>
    </>
  );

  return(
    <><SilkBg/>
      <div className="layout">
        <Topbar player={d.player} serverTime={d.server_time} onShare={()=>setSharing(true)}/>
        <div className="content">
          {tab==='quests'&&<QuestsTab quests={d.quests??[]} onComplete={completeQ} onEdit={q=>setModal({type:'q',quest:q})} onDelete={deleteQ}/>}
          {tab==='tags'  &&<TagsTab  tags={d.quick_tags??[]} onUse={tag=>setModal({type:'t',tag})}/>}
          {tab==='charts'&&<ChartsTab charts={d.charts}/>}
          {tab==='weekly'&&<WeeklyTab weekly={d.weekly} weekly_outline={d.weekly_outline} reminders={d.reminders??[]}/>}
        </div>
        {tab==='quests'&&(
          <button className="fab" onClick={()=>setModal({type:'q'})}>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" strokeLinecap="round">
              <line x1="11" y1="4" x2="11" y2="18" stroke="rgba(255,248,200,.95)" strokeWidth="2.2"/>
              <line x1="4" y1="11" x2="18" y2="11" stroke="rgba(255,248,200,.95)" strokeWidth="2.2"/>
            </svg>
          </button>
        )}
        <nav className="bnav">
          {TABS.map(t=>{
            const Icon=TabIcons[t.id];
            return(
              <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>setTab(t.id)}>
                <div className="tab-ico"><Icon on={tab===t.id}/></div>
                <span>{t.lbl}</span>
                {tab===t.id&&<div className="tab-dot"/>}
              </button>
            );
          })}
        </nav>
      </div>
      {modal?.type==='q'&&<QuestModal quest={modal.quest} onClose={()=>setModal(null)} onSave={saveQuest}/>}
      {modal?.type==='t'&&<TagModal   tag={modal.tag}    onClose={()=>setModal(null)} onSave={saveTag}/>}
      {confirm&&<Confirm msg={confirm.msg} onYes={doDelete} onNo={()=>setConf(null)}/>}
      {toast  &&<Toast key={toast.k} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {sharing&&<ShareOverlay data={d} onClose={()=>setSharing(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
